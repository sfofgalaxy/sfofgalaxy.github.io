name: Update Google Scholar citations

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Scholar client
        run: python -m pip install --disable-pip-version-check "scholarly>=1.7.11,<2"

      - name: Fetch citations
        run: python scripts/update_scholar_citations.py

      - name: Commit updated count
        run: |
          if git diff --quiet -- _config.yml; then
            echo "No citation update to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _config.yml
          git commit -m "Update Google Scholar citation count"
          git push
